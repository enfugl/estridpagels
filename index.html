<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estrid Pagels</title>
<meta name="description" content="Estrid Pagels — borger i Danmark.">
<meta property="og:title" content="Estrid Pagels">
<meta property="og:description" content="Borger i Danmark.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://estridpagels.dk/">
<meta property="og:locale" content="da_DK">

<!-- Display-serif. Virker uden nettet også — falder tilbage til Georgia. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css">
</head>
<body>

<header>
  <nav class="wrap nav">
    <a class="brand" href="/">Estrid Pagels</a>
    <ul>
      <li><a href="donorbarn.html">Donorbarn</a></li>
      <li><a href="#kontakt">Kontakt</a></li>
    </ul>
  </nav>
</header>

<main id="top">

  <!-- ===================== FORSIDE ===================== -->
  <div class="hero wrap">
    <div class="hero-grid">
      <figure>
        <img src="billeder/estrid.jpg" alt="Estrid Pagels">
      </figure>
      <div>
        <p class="eyebrow">Borger i Danmark</p>
        <h1>Estrid Pagels</h1>
        <a class="arrow" href="#kontakt">Skriv til Estrid &rarr;</a>
      </div>
    </div>
  </div>

  <!-- ===================== KONTAKT ===================== -->
  <section id="kontakt">
    <div class="wrap">
      <h2>Kontakt</h2>
      <p class="sub">Skriv endelig — jeg vender tilbage, når jeg kan.</p>

      <div class="kontakt-grid">
        <!--
          Formularen sender via Web3Forms — gratis, og kræver ingen server.
          Sådan gør du:
          1. Gå på web3forms.com, indtast estridpagels@proton.me, få en access key på mail
          2. Indsæt nøglen i value="…" i det skjulte felt nedenfor
          Beskederne lander derefter direkte i indbakken.
        -->
        <form class="form" action="https://api.web3forms.com/submit" method="POST">
          <!-- ▼ INDSÆT NØGLEN FRA web3forms.com HER ▼ -->
          <input type="hidden" name="access_key" value="DIN-ACCESS-KEY">
          <input type="hidden" name="subject" value="Henvendelse fra estridpagels.dk">
          <input type="hidden" name="from_name" value="estridpagels.dk">
          <input type="hidden" name="redirect" value="https://estridpagels.dk/?tak=1">

          <div class="field-grid">
            <p class="field">
              <label for="navn">Dit navn</label>
              <input id="navn" name="navn" type="text" required>
            </p>
            <p class="field">
              <label for="mail">Din e-mail</label>
              <input id="mail" name="email" type="email" required>
            </p>
          </div>
          <p class="field">
            <label for="besked">Din besked</label>
            <textarea id="besked" name="besked" rows="6" required></textarea>
          </p>
          <!-- Fælde for spam-robotter. Skjult for mennesker — lad den stå tom. -->
          <p class="honeypot" aria-hidden="true"><label>Website<input name="botcheck" type="checkbox" tabindex="-1"></label></p>
          <button class="send" type="submit">Send besked</button>
          <p class="besked-status" id="status" hidden></p>
        </form>

        <aside class="kontakt-aside">
          <p class="alabel">Eller skriv direkte</p>
          <p class="avalue">
            <!-- Skrevet ud i ord, så robotter ikke opsamler adressen -->
            <a href="mailto:estridpagels@proton.me">estridpagels [snabel-a] proton [punktum] me</a>
          </p>
        </aside>
      </div>
    </div>
  </section>

</main>

<footer class="wrap">
  <div class="foot-bottom">
    <span>© <span id="aar">2026</span> Estrid Pagels</span>
    <button class="theme-btn" id="theme">Skift lys / mørk</button>
  </div>
</footer>

<script>
  document.getElementById('aar').textContent = new Date().getFullYear();

  // Web3Forms sender retur hertil med ?tak=1
  (function(){
    var p = new URLSearchParams(location.search), el = document.getElementById('status');
    if(!el) return;
    if(p.has('tak')){
      el.textContent = 'Tak for din besked — jeg vender tilbage, når jeg kan.';
      el.className = 'besked-status ok'; el.hidden = false;
    }
  })();

  var root = document.documentElement;
  document.getElementById('theme').addEventListener('click', function(){
    var now = root.getAttribute('data-theme');
    if(!now){ now = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    root.setAttribute('data-theme', now === 'dark' ? 'light' : 'dark');
  });
</script>
</body>
</html>
